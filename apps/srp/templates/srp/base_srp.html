{% extends "base.html" %}
{% block title %}SRP — MPPI{% endblock %}
{% block nav_srp %}active{% endblock %}

{% block extra_head %}
<style>
  .importada-badge {
    font-size: .68rem; background: #e8f4fd; color: #0055a4;
    border: 1px solid #b3d4f0; border-radius: 20px; padding: 2px 8px;
  }
  .log-box {
    background: #1e1e1e; color: #d4d4d4;
    font-family: 'Courier New', monospace; font-size: .82rem;
    border-radius: 8px; padding: 1rem;
    max-height: 400px; overflow-y: auto; white-space: pre-wrap;
  }
  .carona-bloqueada { background: #fff3cd; border-left: 4px solid #ffc107; }
  .vigencia-critica  { color: #dc3545; font-weight: 700; }
  .vigencia-atencao  { color: #fd7e14; font-weight: 600; }
  .vigencia-ok       { color: #198754; }
  .vigencia-expirada { color: #6c757d; font-style: italic; }
  .badge-critica  { background: #dc3545; color: #fff; font-size: .68rem; padding: 2px 6px; border-radius: 20px; }
  .badge-atencao  { background: #fd7e14; color: #fff; font-size: .68rem; padding: 2px 6px; border-radius: 20px; }
  .saldo-positivo { color: #198754; font-weight: 600; }
  .saldo-zero     { color: #dc3545; font-weight: 600; }
  .saldo-eventual { color: #0055a4; font-weight: 600; }
  .arp-card { border: none; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .arp-card .card-header { background: #003366; color: #fff; border-radius: 10px 10px 0 0 !important; }
  {% block srp_extra_style %}{% endblock %}
</style>
{% endblock %}
